services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runner
    container_name: trial-booking-server
    restart: unless-stopped
    ports:
      - '24001:24001'
    environment:
      NODE_ENV: production
      PORT: 24001
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:24001/api/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard-runner
      args:
        NUXT_API_PROXY_TARGET: http://server:24001
    container_name: trial-booking-dashboard
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '24002:24002'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 24002
      NUXT_API_PROXY_TARGET: http://server:24001
